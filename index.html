<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nikos Kanistras — Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Nikos Kanistras</a>
    <nav class="site-nav">
      <a href="index.html" class="active">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <!-- Hero: your signature shot, full width -->
    <section class="hero">
      <img src="images/hero.jpg" alt="Signature photograph">
      <p class="hero-caption">Nicosia, Cyprus — 2026</p>
    </section>

    <!-- Masonry photo grid -->
    <section class="gallery" id="gallery">
      <figure class="photo">
        <img src="images/photo1.jpg" alt="Description of photo one">
        <figcaption>Santorini, 2025</figcaption>
      </figure>
      <figure class="photo">
        <img src="images/photo2.jpg" alt="Description of photo two">
        <figcaption>Athens, 2025</figcaption>
      </figure>
      <figure class="photo">
        <img src="images/photo3.jpg" alt="Description of photo three">
        <figcaption>Meteora, 2024</figcaption>
      </figure>
      <!-- Copy/paste a figure block per photo -->
    </section>
  </main>

  <footer class="site-footer">
    <div class="social">
      <a href="https://instagram.com/yourhandle" target="_blank" rel="noopener">Instagram</a>
      <a href="mailto:you@example.com">Email</a>
    </div>
    <p>&copy; 2026 Nikos Kanistras</p>
  </footer>

  <script src="script.js"></script>
