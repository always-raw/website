  <!-- ---------- Lightbox (hidden until a tearsheet is clicked) ---------- -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&#10005;</button>
    <figure class="lightbox-inner">
      <img id="lightbox-img" src="" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </div>

  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxCaption = document.getElementById("lightbox-caption");

    // Open: read the three data-* attributes from the clicked figure
    document.querySelectorAll(".tearsheet").forEach(function (fig) {
      fig.addEventListener("click", function () {
        lightboxImg.src = fig.querySelector("img").src;
        lightboxImg.alt = fig.querySelector("img").alt;

        // Build the caption as a link to the original article
        const link = document.createElement("a");
        link.href = fig.dataset.article;
        link.target = "_blank";       // open in a new tab
        link.rel = "noopener";         // good practice for new tabs
        link.textContent = fig.dataset.caption;

        lightboxCaption.innerHTML = "";
        lightboxCaption.appendChild(link);

        lightbox.hidden = false;
      });
    });

    // Close helpers
    function closeLightbox() {
      lightbox.hidden = true;
      lightboxImg.src = "";           // frees the browser's memory
    }

    document.getElementById("lightbox-close")
      .addEventListener("click", closeLightbox);

    lightbox.addEventListener("click", function (e) {
      if (e.target === lightbox) closeLightbox();  // clicked the dark backdrop
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !lightbox.hidden) closeLightbox();
    });
  </script>
