<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stories — Nikos Kanistras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="stories.css">
</head>
<body>
  <script src="header.js"></script>

  <main class="site-main">
    <h1 class="page-title">Stories</h1>

    <!-- ============ STORY LIST — one column, mini-covers ============
         HOW TO ADD A NEW STORY:
         1. Duplicate the <a class="story-listing"> block.
         2. Point href to the story page file (e.g. omonoia.html).
         3. Swap the image — best to reuse the story's hero photo,
            so card and cover read as the same article.
         4. Fill title, subtitle, place/date EXACTLY as on the
            story cover, so they match when the reader clicks in. -->
    <div class="stories-list">

      <!-- ===== ONE STORY ===== -->
      <a class="story-listing" href="story_addiction.html">
        <img src="images/stories/omonoia/20210612-Orama_Wrkshp_Omonoia_Gray_Square-0043.jpg"
             alt="Cover photo of the Omonoia story"
             loading="lazy">
        <span class="listing-overlay"></span>
        <span class="listing-text">
          <span class="listing-title">Behind Athens&rsquo; Unseen Streets</span>
          <span class="listing-subtitle">Stories of the people everyone avoids</span>
          <span class="listing-meta">Athens, Greece — 2021</span>
        </span>
      </a>
      <!-- ===== END OF STORY ===== -->

      <!-- Copy-paste the block above for each new story.
           First card above is filled in as a working example. -->

    </div>
  </main>

  <script src="stories.js"></script>
</body>
</html>
